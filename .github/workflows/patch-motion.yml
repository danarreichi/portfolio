name: Patch ambient motion

on:
  push:
    paths:
      - .github/workflows/patch-motion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load ambient motion script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()
          line = "\nimport('./motion-loader.js');\n"
          if "motion-loader.js" not in s:
              s += line
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Enable animated ambient background"
          git push
