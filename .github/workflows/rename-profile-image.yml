name: Update profile image source

on:
  push:
    paths:
      - .github/workflows/rename-profile-image.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update image source
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='assets/djatu-profile.jpg'; new='assets/me.jpg'; assert old in s, 'Old image source not found'; p.write_text(s.replace(old,new,1))"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use me.jpg for profile image"
          git push
