name: Fix MySQL icon

on:
  push:
    paths:
      - .github/workflows/fix-mysql-icon.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace MySQL icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<i class="fa-brands fa-mysql" aria-hidden="true"></i>MySQL'
          new = '<i class="fa-solid fa-database" aria-hidden="true"></i>MySQL'
          if old not in s:
              raise SystemExit('MySQL Font Awesome icon not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use database icon for MySQL stack pill"
          git push
