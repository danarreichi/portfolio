name: Use Font Awesome stack icons

on:
  push:
    paths:
      - .github/workflows/use-fontawesome-stack.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace custom stack SVGs with Font Awesome
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text()

          fa_link = '  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />\n'
          if 'font-awesome/6.7.2/css/all.min.css' not in html:
              html = html.replace('  <link rel="stylesheet" href="styles.css" />', fa_link + '  <link rel="stylesheet" href="styles.css" />', 1)

          stack = '''            <div class="tag-row">
              <span class="tech-pill"><i class="fa-brands fa-php" aria-hidden="true"></i>PHP</span>
              <span class="tech-pill"><i class="fa-solid fa-fire-flame-curved" aria-hidden="true"></i>CodeIgniter</span>
              <span class="tech-pill"><i class="fa-brands fa-laravel" aria-hidden="true"></i>Laravel</span>
              <span class="tech-pill"><i class="fa-brands fa-python" aria-hidden="true"></i>Python</span>
              <span class="tech-pill"><i class="fa-solid fa-code" aria-hidden="true"></i>Django</span>
              <span class="tech-pill"><i class="fa-brands fa-node-js" aria-hidden="true"></i>Node.js</span>
              <span class="tech-pill"><i class="fa-brands fa-mysql" aria-hidden="true"></i>MySQL</span>
              <span class="tech-pill"><i class="fa-solid fa-diagram-project" aria-hidden="true"></i>REST API</span>
            </div>'''

          pattern = re.compile(r'            <div class="tag-row">\s*(?:<span class="tech-pill">.*?</span>\s*){8}</div>', re.S)
          html, count = pattern.subn(stack, html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one core stack block, replaced {count}')

          index.write_text(html)

          css_file = Path('styles.css')
          css = css_file.read_text()
          css = re.sub(r'\n?/\* core stack icons \*/\n?\.tech-pill\{.*?\}\s*$', '', css, flags=re.S)
          css += '''\n/* core stack icons */\n.tech-pill{display:inline-flex!important;align-items:center;gap:7px;transition:transform .2s var(--ease),background .2s ease,color .2s ease}.tech-pill i{width:15px;flex:0 0 15px;color:var(--accent2);font-size:14px;line-height:1;text-align:center;opacity:.95}.tech-pill:hover{transform:translateY(-1px);background:rgba(255,255,255,.08);color:var(--text)}.tech-pill:hover i{opacity:1}\n'''
          css_file.write_text(css)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Use Font Awesome icons for core stack"
          git push
