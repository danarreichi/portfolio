name: Remove footer tagline

on:
  push:
    paths:
      - .github/workflows/remove-footer-tagline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove footer tagline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('    <span data-i18n="footer.built">Designed & built with HTML, CSS & JavaScript.</span>\n', '')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove footer build tagline"
          git push
