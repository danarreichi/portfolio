name: Add Danar nickname

on:
  push:
    paths:
      - .github/workflows/add-danar-nickname.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update nickname branding
        run: |
          python <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          replacements = [
              ('aria-label="Djatu home"', 'aria-label="Danar home"'),
              ('<span class="brand-text">Djatu.</span>', '<span class="brand-text">Danar.</span>'),
              ("I'm <strong>Djatu Hamidan Ardiwinanto</strong>, a Full Stack Web Developer focused on dependable backend systems, clean APIs, and maintainable web applications.", "I'm <strong>Djatu Hamidan Ardiwinanto (Danar)</strong>, a Full Stack Web Developer focused on dependable backend systems, clean APIs, and maintainable web applications."),
          ]
          for old, new in replacements:
              assert old in s, f'index replacement not found: {old}'
              s = s.replace(old, new, 1)
          index.write_text(s)

          script = Path('script.js')
          s = script.read_text()
          replacements = [
              ("I'm <strong>Djatu Hamidan Ardiwinanto</strong>, a Full Stack Web Developer focused on dependable backend systems, clean APIs, and maintainable web applications.", "I'm <strong>Djatu Hamidan Ardiwinanto (Danar)</strong>, a Full Stack Web Developer focused on dependable backend systems, clean APIs, and maintainable web applications."),
              ('Saya <strong>Djatu Hamidan Ardiwinanto</strong>, seorang Full Stack Web Developer dengan fokus pada sistem backend yang andal, API yang rapi, dan aplikasi web yang mudah dipelihara.', 'Saya <strong>Djatu Hamidan Ardiwinanto (Danar)</strong>, seorang Full Stack Web Developer dengan fokus pada sistem backend yang andal, API yang rapi, dan aplikasi web yang mudah dipelihara.'),
          ]
          for old, new in replacements:
              assert old in s, f'script replacement not found: {old}'
              s = s.replace(old, new, 1)
          script.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git commit -m "Use Danar as portfolio nickname"
          git push
