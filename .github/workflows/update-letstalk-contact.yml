name: Update Let's talk contact link

on:
  push:
    paths:
      - .github/workflows/update-letstalk-contact.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero CTA
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='href=\"mailto:danar.ardiwinanto@gmail.com\"><span data-i18n=\"hero.talk\">Let\'s talk</span>'; new='href=\"#contact\"><span data-i18n=\"hero.talk\">Let\'s talk</span>'; assert old in s, 'Hero CTA not found'; p.write_text(s.replace(old,new,1))"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Scroll Let's talk CTA to contact section"
          git push
