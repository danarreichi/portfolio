name: Restore parent navbar frost

on:
  push:
    paths:
      - .github/workflows/restore-parent-nav-frost.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep parent navbar frosted when mobile menu opens
        run: python -c "from pathlib import Path; p=Path('motion-loader.js'); s=p.read_text(); old='      .nav-shell:has(.nav-links.open){\\n        -webkit-backdrop-filter:none!important;\\n        backdrop-filter:none!important;\\n      }\\n'; assert old in s, 'Parent navbar blur-disable rule not found'; p.write_text(s.replace(old,'',1))"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-loader.js
          git commit -m "Keep parent navbar frosted with mobile menu open"
          git push
