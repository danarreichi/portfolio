name: Update Indonesian hero copy

on:
  push:
    paths:
      - .github/workflows/update-indonesian-hero-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero description
        run: python -c "from pathlib import Path; p=Path('script.js'); s=p.read_text(); old='Saya <strong>Djatu Hamidan Ardiwinanto</strong>, seorang Full Stack Web Developer yang berfokus pada sistem backend yang andal, API yang rapi, dan aplikasi web yang mudah dipelihara.'; new='Saya <strong>Djatu Hamidan Ardiwinanto</strong>, seorang Full Stack Web Developer dengan fokus pada sistem backend yang andal, API yang rapi, dan aplikasi web yang mudah dipelihara.'; assert old in s, 'Old hero copy not found'; p.write_text(s.replace(old,new,1))"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Refine Indonesian hero description"
          git push
