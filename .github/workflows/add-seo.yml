name: Add portfolio SEO

on:
  push:
    paths:
      - .github/workflows/add-seo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add SEO head markup
        run: python -c "from pathlib import Path; import base64; p=Path('index.html'); s=p.read_text(); old='  <meta name=\"description\" content=\"Portfolio of Djatu Hamidan Ardiwinanto — Full Stack Web Developer based in Surabaya, Indonesia.\" />\\n  <meta name=\"theme-color\" content=\"#090b12\" />\\n  <title>Djatu Hamidan Ardiwinanto — Full Stack Developer</title>'; new=base64.b64decode('').decode(); assert old in s, 'SEO insertion point not found'; p.write_text(s.replace(old,new,1))"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add SEO metadata and structured data"
          git push
