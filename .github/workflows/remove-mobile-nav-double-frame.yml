name: Remove mobile nav double frame

on:
  push:
    paths:
      - .github/workflows/remove-mobile-nav-double-frame.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make nav links visually transparent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('motion-loader.js')
          s = p.read_text()
          old = "      .nav-links.open{\n        background:rgba(8,10,18,.10)!important;\n        -webkit-backdrop-filter:none!important;\n        backdrop-filter:none!important;\n        box-shadow:inset 0 1px 0 rgba(255,255,255,.06)!important;\n      }"
          new = "      .nav-links.open{\n        background:transparent!important;\n        border:0!important;\n        outline:0!important;\n        -webkit-backdrop-filter:none!important;\n        backdrop-filter:none!important;\n        box-shadow:none!important;\n      }"
          if old not in s:
              raise SystemExit('Dark mobile nav block not found')
          s = s.replace(old, new, 1)
          old_light = "      html[data-theme=\"light\"] .nav-links.open{\n        background:rgba(255,255,255,.08)!important;\n      }"
          new_light = "      html[data-theme=\"light\"] .nav-links.open{\n        background:transparent!important;\n        border:0!important;\n        box-shadow:none!important;\n      }"
          if old_light not in s:
              raise SystemExit('Light mobile nav block not found')
          s = s.replace(old_light, new_light, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-loader.js
          git commit -m "Remove duplicate mobile navigation frame"
          git push
