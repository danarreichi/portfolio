name: Cache bust portfolio script

on:
  push:
    paths:
      - .github/workflows/cache-bust-script.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache bust script.js
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<script src="script.js"></script>'
          new = '<script src="script.js?v=20260818-1517"></script>'
          if old in s:
              s = s.replace(old, new, 1)
          elif '<script src="script.js?' in s:
              import re
              s = re.sub(r'<script src="script\.js\?[^\"]*"></script>', new, s, count=1)
          else:
              raise SystemExit('script.js tag not found')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Cache bust portfolio script"
          git push
