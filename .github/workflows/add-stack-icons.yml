name: Add stack icons

on:
  push:
    paths:
      - .github/workflows/add-stack-icons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add icons to core stack pills
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          old = '''            <div class="tag-row">
              <span>PHP</span><span>CodeIgniter</span><span>Laravel</span><span>Python</span><span>Django</span><span>Node.js</span><span>MySQL</span><span>REST API</span>
            </div>'''
          new = '''            <div class="tag-row">
              <span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="3"/><path d="m8 10-2 2 2 2M16 10l2 2-2 2M13.5 9l-3 6"/></svg><span>PHP</span></span>
              <span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5.5 6.7v7.5L12 21l6.5-6.8V6.7z"/><path d="M9 8.5h6v7H9z"/></svg><span>CodeIgniter</span></span>
              <span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17.5 8.5 6l3 5 2-6 5.5 12.5-7 2z"/></svg><span>Laravel</span></span>
              <span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5h5a3 3 0 0 1 3 3V11H10a3 3 0 0 0-3 3v1.5H5.5v-7a3 3 0 0 1 3-3Z"/><path d="M15.5 18.5h-5a3 3 0 0 1-3-3V13H14a3 3 0 0 0 3-3V8.5h1.5v7a3 3 0 0 1-3 3Z"/></svg><span>Python</span></span>
              <span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5v14H5zM12 5h7v5h-7zM12 12h7v7h-7z"/></svg><span>Django</span></span>
              <span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 19 8v8l-7 4-7-4V8z"/><path d="M9 9.5v5l3 1.7 3-1.7v-5"/></svg><span>Node.js</span></span>
              <span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.5" rx="7" ry="3"/><path d="M5 6.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5M5 11.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg><span>MySQL</span></span>
              <span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="7" r="2.2"/><circle cx="18" cy="17" r="2.2"/><path d="m8 11 8-3M8 13l8 3"/></svg><span>REST API</span></span>
            </div>'''
          if old not in s:
              raise SystemExit('Core stack block not found')
          p.write_text(s.replace(old, new))

          p = Path('styles.css')
          s = p.read_text()
          old = '.tag-row span,.project-tags span{padding:7px 10px;background:rgba(255,255,255,.055);border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:11px;font-weight:700}'
          new = '.tech-pill,.project-tags span{padding:7px 10px;background:rgba(255,255,255,.055);border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:11px;font-weight:700}.tech-pill{display:inline-flex;align-items:center;gap:7px;transition:transform .2s var(--ease),background .2s ease,color .2s ease}.tech-pill svg{width:14px;height:14px;flex:0 0 14px;fill:none;stroke:var(--accent2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.95}.tech-pill:hover{transform:translateY(-1px);background:rgba(255,255,255,.08);color:var(--text)}'
          if old not in s:
              # Support the expanded/non-minified local stylesheet variant.
              old = '.tag-row span, .project-tags span { padding: 7px 10px; background: rgba(255,255,255,.055); border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: 11px; font-weight: 700; }'
              new = '.tech-pill, .project-tags span { padding: 7px 10px; background: rgba(255,255,255,.055); border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: 11px; font-weight: 700; }\n.tech-pill { display: inline-flex; align-items: center; gap: 7px; transition: transform .2s var(--ease), background .2s ease, color .2s ease; }\n.tech-pill svg { width: 14px; height: 14px; flex: 0 0 14px; fill: none; stroke: var(--accent2); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .95; }\n.tech-pill:hover { transform: translateY(-1px); background: rgba(255,255,255,.08); color: var(--text); }'
          if old not in s:
              raise SystemExit('Tag pill CSS rule not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Add icons to core stack pills"
          git push
