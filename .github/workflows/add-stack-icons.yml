name: Add stack icons

on:
  push:
    paths:
      - .github/workflows/add-stack-icons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add icons to core stack pills
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_stack = '<span>PHP</span><span>CodeIgniter</span><span>Laravel</span><span>Python</span><span>Django</span><span>Node.js</span><span>MySQL</span><span>REST API</span>'
          new_stack = '''<span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="3"/><path d="m8 10-2 2 2 2M16 10l2 2-2 2M13.5 9l-3 6"/></svg>PHP</span><span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5.5 6.7v7.5L12 21l6.5-6.8V6.7z"/><path d="M9 8.5h6v7H9z"/></svg>CodeIgniter</span><span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17.5 8.5 6l3 5 2-6 5.5 12.5-7 2z"/></svg>Laravel</span><span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5h5a3 3 0 0 1 3 3V11H10a3 3 0 0 0-3 3v1.5H5.5v-7a3 3 0 0 1 3-3Z"/><path d="M15.5 18.5h-5a3 3 0 0 1-3-3V13H14a3 3 0 0 0 3-3V8.5h1.5v7a3 3 0 0 1-3 3Z"/></svg>Python</span><span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5v14H5zM12 5h7v5h-7zM12 12h7v7h-7z"/></svg>Django</span><span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 19 8v8l-7 4-7-4V8z"/><path d="M9 9.5v5l3 1.7 3-1.7v-5"/></svg>Node.js</span><span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.5" rx="7" ry="3"/><path d="M5 6.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5M5 11.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>MySQL</span><span class="tech-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="7" r="2.2"/><circle cx="18" cy="17" r="2.2"/><path d="m8 11 8-3M8 13l8 3"/></svg>REST API</span>'''

          if old_stack not in s:
              raise SystemExit('Core stack technologies not found')
          s = s.replace(old_stack, new_stack, 1)

          # Complete the previously requested GPA -> experience card change too.
          s = s.replace('<span class="mini-number">3.78</span>', '<span class="mini-number">3+</span>', 1)
          p.write_text(s)

          p = Path('styles.css')
          s = p.read_text()
          marker = '/* core stack icons */'
          if marker not in s:
              s += '''\n/* core stack icons */\n.tech-pill{display:inline-flex!important;align-items:center;gap:7px;transition:transform .2s var(--ease),background .2s ease,color .2s ease}.tech-pill svg{width:14px;height:14px;flex:0 0 14px;fill:none;stroke:var(--accent2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.95}.tech-pill:hover{transform:translateY(-1px);background:rgba(255,255,255,.08);color:var(--text)}\n'''
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Add icons to core stack pills"
          git push
